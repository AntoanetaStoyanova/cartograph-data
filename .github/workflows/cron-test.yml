name: Test du cron

on:
  schedule:
    - cron: "*/15 * * * *"

permissions: {}

concurrency:
  group: cron-test
  cancel-in-progress: false

jobs:
  tick:
    name: Heure de déclenchement
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Afficher la date
        run: date -u
