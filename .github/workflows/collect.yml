name: Collecte

on:
  workflow_dispatch:
    inputs:
      catalogue:
        description: "Catalogue : auto = le lundi (UTC)"
        type: choice
        options: [auto, oui, non]
        default: auto
      prices:
        description: Collecter les prix
        type: boolean
        default: true
      languages:
        description: Langues séparées par des virgules (vide = toutes)
        type: string
        default: ""
      code_ref:
        description: Branche ou tag de cartograph à installer
        type: string
        default: main

permissions: {}

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    name: Collecte du jour
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write # publier le catalogue dans la Release `catalogue`, commiter le manifeste
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DATA_DIR: ${{ github.workspace }}/data
    steps:
      # Jamais bloquant : une panne de healthchecks.io finit en alerte, pas en échec.
      - name: Signaler le début
        env:
          HC_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: curl -fsS -m 10 --retry 5 -o /dev/null "$HC_URL/start" || true

      - name: Installer cartograph
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AntoanetaStoyanova/cartograph
          ref: ${{ inputs.code_ref || 'main' }}
          path: code
          fetch-depth: 1
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: code
          enable-cache: true
          cache-dependency-glob: uv.lock # relatif à working-directory

      - name: Installer les dépendances
        working-directory: code
        run: uv sync --frozen --no-dev

      - name: Choisir les étapes
        id: plan
        env:
          INPUT_CATALOGUE: ${{ inputs.catalogue }}
          INPUT_PRICES: ${{ inputs.prices }}
        run: |
          catalogue=false
          prices=$INPUT_PRICES
          case "$INPUT_CATALOGUE" in
            oui) catalogue=true ;;
            non) ;;
            *) if [[ "$(date -u +%u)" == 1 ]]; then catalogue=true; fi ;;
          esac
          echo "catalogue=$catalogue" >> "$GITHUB_OUTPUT"
          echo "prices=$prices" >> "$GITHUB_OUTPUT"
          echo "Catalogue : $catalogue, prix : $prices"

      # Aussi le jour du catalogue : si sa collecte échoue, les prix utilisent le précédent.
      - name: Télécharger le dernier catalogue
        if: steps.plan.outputs.prices == 'true'
        run: |
          if ! assets=$(gh release view catalogue --json assets --jq '.assets[].name'); then
            echo "::notice::Release catalogue absente : aucun catalogue précédent."
            exit 0
          fi
          latest=$(grep -E '^cards-[0-9]{4}-[0-9]{2}-[0-9]{2}\.parquet$' <<< "$assets" | sort | tail -n 1 || true)
          if [[ -z "$latest" ]]; then
            echo "::notice::Release catalogue vide."
            exit 0
          fi
          gh release download catalogue --pattern "$latest" --dir "$DATA_DIR/snapshots"
          echo "Catalogue précédent : $latest"

      # Délai propre à l'étape : les publications tournent même si la collecte s'éternise.
      - name: Collecter
        id: collect
        continue-on-error: true
        timeout-minutes: 270
        working-directory: code
        env:
          TCGDEX_USER_AGENT: ${{ vars.TCGDEX_USER_AGENT }}
          CATALOGUE: ${{ steps.plan.outputs.catalogue }}
          PRICES: ${{ steps.plan.outputs.prices }}
          LANGUAGES: ${{ inputs.languages }}
        run: |
          args=(--data-dir "$DATA_DIR")
          [[ "$CATALOGUE" == true ]] && args+=(--catalogue)
          [[ "$PRICES" == true ]] || args+=(--no-prices)
          [[ -n "$LANGUAGES" ]] && args+=(--languages "$LANGUAGES")
          uv run --no-sync python -m cartograph.bin.collect.run "${args[@]}"

      - name: Lire le résumé
        id: summary
        if: ${{ !cancelled() }}
        working-directory: code
        run: |
          shopt -s nullglob
          summaries=("$DATA_DIR"/runs/collect-*.json)
          if (( ${#summaries[@]} == 0 )); then
            echo "::warning::Aucun résumé : la collecte n'a rien écrit."
            echo "Aucun résumé : la collecte n'a rien écrit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          uv run --no-sync python -m cartograph.bin.collect.report "${summaries[0]}" >> "$GITHUB_STEP_SUMMARY"
          day=$(jq -r .date "${summaries[0]}")
          echo "day=$day" >> "$GITHUB_OUTPUT"
          echo "catalogue=$(jq -r .steps.catalogue.status "${summaries[0]}")" >> "$GITHUB_OUTPUT"
          jq -c '.steps | map_values({status, fetched, failed: (.failed | length), error})' "${summaries[0]}"

      # Destinations prises du manifeste : la règle fichier → Release n'existe que dans cartograph.
      - name: Calculer le manifeste
        id: manifest
        if: ${{ !cancelled() }}
        working-directory: code
        env:
          TCGDEX_USER_AGENT: ${{ vars.TCGDEX_USER_AGENT }} # exigé à l'import de cartograph.config
          DAY: ${{ steps.summary.outputs.day }}
          RUN_ID: ${{ github.run_id }}
        run: |
          args=(--data-dir "$DATA_DIR" --run-id "$RUN_ID")
          if [[ -n "$DAY" ]]; then
            args+=(--summary "$DATA_DIR/runs/collect-$DAY.json")
          else
            DAY=$(date -u +%F)
          fi
          # Taille inconnue (-1) plutôt qu'un manifeste manquant, qui bloquerait les envois.
          repo_kib=$(gh api "repos/$GH_REPO" --jq .size) || repo_kib=-1
          uv run --no-sync python -m cartograph.bin.collect.manifest "${args[@]}" \
            --date "$DAY" --repo-kib="$repo_kib" > "$RUNNER_TEMP/manifest.json"
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          jq -c '.files[] | {name, release, rows}' "$RUNNER_TEMP/manifest.json"
          jq -r '.files[] | select(.sha256 == null) | "::warning::Absent du disque, non envoyé : \(.name)"' "$RUNNER_TEMP/manifest.json"

      - name: Publier le catalogue
        if: ${{ !cancelled() && steps.summary.outputs.catalogue == 'ok' && steps.manifest.outcome == 'success' }}
        run: |
          # Une erreur de jq doit faire échouer l'étape, pas passer pour « rien à envoyer ».
          list=$(jq -r '.files[] | select(.release == "cartograph-data/catalogue" and .sha256 != null) | .name' "$RUNNER_TEMP/manifest.json")
          if [[ -z "$list" ]]; then
            echo "Aucun catalogue à publier."
            exit 0
          fi
          mapfile -t names <<< "$list"
          gh release view catalogue > /dev/null 2>&1 \
            || gh release create catalogue --title "Catalogue TCGdex" \
              --notes "Un cards-AAAA-MM-JJ.parquet par semaine, sans aucun prix. Données TCGdex, licence MIT."
          gh release upload catalogue "${names[@]/#/$DATA_DIR/snapshots/}" --clobber
          echo "Catalogue publié : ${names[*]}"

      # Prix et brut (qui contient aussi des prix) : dépôt privé uniquement, jamais en artefact.
      - name: Envoyer prix et brut dans cartograph-prices
        if: ${{ !cancelled() && steps.manifest.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.PRICES_TOKEN }}
          GH_REPO: AntoanetaStoyanova/cartograph-prices
        run: |
          manifest="$RUNNER_TEMP/manifest.json"
          locate() {
            for dir in snapshots raw; do
              if [[ -f "$DATA_DIR/$dir/$1" ]]; then
                echo "$DATA_DIR/$dir/$1"
                return 0
              fi
            done
            return 1
          }
          # Une erreur de jq doit faire échouer l'étape, pas passer pour « rien à envoyer ».
          list=$(jq -r '[.files[] | select(.sha256 != null) | .release | select(startswith("cartograph-prices/")) | ltrimstr("cartograph-prices/")] | unique[]' "$manifest")
          if [[ -z "$list" ]]; then
            echo "Aucun fichier de prix ni brut à envoyer."
            exit 0
          fi
          mapfile -t tags <<< "$list"
          for tag in "${tags[@]}"; do
            list=$(jq -r --arg release "cartograph-prices/$tag" '.files[] | select(.release == $release and .sha256 != null) | .name' "$manifest")
            mapfile -t names <<< "$list"
            files=()
            for name in "${names[@]}"; do
              files+=("$(locate "$name")")
            done
            gh release view "$tag" > /dev/null 2>&1 \
              || gh release create "$tag" --title "$tag" --notes "Prix et JSON brut du mois ${tag#data-}."
            gh release upload "$tag" "${files[@]}" --clobber
            printf 'Envoyé dans %s : %s\n' "$tag" "${names[*]}"
          done

      - name: Garder le résumé et le log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collecte-${{ github.run_id }}
          path: |
            data/runs/collect-*.json
            code/logs/*.log
          retention-days: 7
          if-no-files-found: warn

      # Jamais bloquant : un manifeste raté ne change ni le statut ni le signal healthchecks.io.
      - name: Commiter le manifeste
        if: ${{ !cancelled() && steps.manifest.outcome == 'success' }}
        continue-on-error: true
        env:
          DAY: ${{ steps.manifest.outputs.day }}
        run: |
          path="manifest/${DAY:0:4}/$DAY.json"
          args=(-X PUT "repos/$GH_REPO/contents/$path"
            -f message="chore: manifeste du $DAY"
            -f content="$(base64 -w0 "$RUNNER_TEMP/manifest.json")")
          # Relance le même jour : remplacer le fichier existant demande son sha.
          if sha=$(gh api "repos/$GH_REPO/contents/$path" --jq .sha 2> /dev/null); then
            args+=(-f sha="$sha")
          fi
          gh api "${args[@]}" --jq '"Manifeste commité : " + .commit.sha'

      # Aussi après un délai dépassé ou une installation ratée : /fail alerte tout de suite.
      - name: Signaler la fin
        if: always()
        env:
          HC_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
          JOB_STATUS: ${{ job.status }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          endpoint="$HC_URL"
          if [[ "$JOB_STATUS" != success || "$COLLECT_OUTCOME" != success ]]; then
            endpoint="$HC_URL/fail"
          fi
          curl -fsS -m 10 --retry 5 -o /dev/null "$endpoint" || true

      - name: Signaler l'échec de la collecte
        if: ${{ steps.collect.outcome == 'failure' }}
        run: |
          echo "::error::La collecte a échoué : voir le résumé et le log en artefact."
          exit 1
